name: Feature request
description: An idea for LexisLearned
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem first, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried or considered?
    validations:
      required: false
