name: Release

# Publishes a signed APK when a version tag such as v0.1.0 or v0.1.0-pre1 is pushed, or when this workflow is run by hand
# with a version: it then creates the tag itself on the head of main, for places where a tag cannot be pushed.
# A tag containing a hyphen is published as a pre-release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v, for example 0.1.0-pre4 (tagged as v<version> on the head of main)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Checks
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # The tag being released: the pushed tag, or v<version> for a manual run. Scripts read it as a variable and it is
      # never pasted into them, so a crafted version cannot inject commands.
      TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check a manual release
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Run this workflow on main, not on $GITHUB_REF" >&2
            exit 1
          fi
          tools/release-version.sh "$TAG" > /dev/null
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "Tag $TAG already exists" >&2
            exit 1
          fi

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Work out the app version from the tag
        id: version
        run: tools/release-version.sh "$TAG" >> "$GITHUB_OUTPUT"

      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nkeyAlias=%s\n' "$RUNNER_TEMP/release.jks" "$KEY_ALIAS" > keystore.properties

      - name: Build signed release APK
        env:
          LEXIS_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          LEXIS_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew assembleRelease -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"

      - name: Verify the signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/LexisLearned-release.apk

      - name: Write the SHA-256 checksum
        working-directory: app/build/outputs/apk/release
        run: sha256sum LexisLearned-release.apk > LexisLearned-release.apk.sha256

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: app/build/outputs/apk/release/LexisLearned-release.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            app/build/outputs/apk/release/LexisLearned-release.apk
            app/build/outputs/apk/release/LexisLearned-release.apk.sha256
          # For a pushed tag this is that tag; for a manual run it creates the tag on the commit that was built.
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(env.TAG, '-') }}
          generate_release_notes: true
