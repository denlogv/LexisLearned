name: Release

# Publishes a signed APK when a version tag such as v0.1.0 or v0.1.0-pre1 is pushed.
# A tag containing a hyphen is published as a pre-release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    name: Checks
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Check that the tag matches the app version
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match versionName v$version in app/build.gradle.kts" >&2
            exit 1
          fi

      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nkeyAlias=%s\n' "$RUNNER_TEMP/release.jks" "$KEY_ALIAS" > keystore.properties

      - name: Build signed release APK
        env:
          LEXIS_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          LEXIS_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify the signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/LexisLearned-release.apk

      - name: Write the SHA-256 checksum
        working-directory: app/build/outputs/apk/release
        run: sha256sum LexisLearned-release.apk > LexisLearned-release.apk.sha256

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: app/build/outputs/apk/release/LexisLearned-release.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            app/build/outputs/apk/release/LexisLearned-release.apk
            app/build/outputs/apk/release/LexisLearned-release.apk.sha256
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
