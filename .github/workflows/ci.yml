name: CI

# Runs on every pull request and every push to main, and is reused by the release workflow so a release is
# built only from code that passed exactly the same checks.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Format check (ktlint)
        run: ./gradlew ktlintCheck

      - name: Static analysis (detekt, including the documentation and size rules)
        run: ./gradlew detekt

      - name: Tests of the custom detekt rule
        run: ./gradlew :detekt-rules:test

      - name: Unit tests and coverage gate (80% lines)
        run: ./gradlew testDebugUnitTest jacocoTestReport jacocoTestCoverageVerification

      - name: Android lint
        run: ./gradlew lintDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/jacoco/
            app/build/reports/detekt/
            app/build/reports/ktlint/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
