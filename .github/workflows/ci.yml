name: CI

# Runs on every pull request and every push to main, and is reused by the release workflow so a release is
# built only from code that passed exactly the same checks.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Format check (ktlint)
        run: ./gradlew ktlintCheck

      - name: Static analysis (detekt, including the documentation and size rules)
        run: ./gradlew detekt

      - name: Tests of the custom detekt rule
        run: ./gradlew :detekt-rules:test

      - name: Unit tests and coverage gate (80% lines)
        run: ./gradlew testDebugUnitTest jacocoTestReport jacocoTestCoverageVerification

      - name: Android lint
        run: ./gradlew lintDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/jacoco/
            app/build/reports/detekt/
            app/build/reports/ktlint/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
